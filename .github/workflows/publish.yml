name: Publish

# crates.io is irreversible, so publish only when a GitHub release is published.
# The release workflow drafts it on tag; publishing that draft is the go-ahead.
on:
  release:
    types: [ published ]

permissions:
  contents: read
  id-token: write # mint the OIDC token crates.io Trusted Publishing verifies

env:
  CARGO_TERM_COLOR: always

jobs:
  crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # A manual approval gate before the irreversible publish.
    environment: release
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches crate version
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          crate=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "scryglass") | .version')
          if [ "$tag" != "$crate" ]; then
            echo "tag v$tag does not match crate version $crate"
            exit 1
          fi

      - name: Authenticate via Trusted Publishing
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # The math crate's version moves rarely, and crates.io rejects a
      # version it already has.
      - name: Check whether shader-common is new to crates.io
        id: shader-common
        shell: bash
        working-directory: shaders/common
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "scryglass-shader-common") | .version')

          url="https://crates.io/api/v1/crates/scryglass-shader-common/$version"

          body=$(mktemp)

          status=$(curl -sS \
            -o "$body" \
            -w '%{http_code}' \
            -H 'Accept: application/json' \
            -H 'User-Agent: scryglass-ci (https://github.com/cameronkinsella/scryglass)' \
            "$url")

          case "$status" in
            200)
              echo "new=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "new=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::crates.io returned HTTP $status"
              cat "$body" >&2
              exit 1
              ;;
          esac

      # cargo publish waits for the index, so the main publish below can
      # resolve the fresh version.
      - name: Publish shader-common to crates.io
        if: steps.shader-common.outputs.new == 'true'
        working-directory: shaders/common
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      # CI and the release build already compile every platform, so skip the
      # redundant verify build here (it would only add the GUI build deps back).
      - name: Publish to crates.io
        run: cargo publish --no-verify --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
